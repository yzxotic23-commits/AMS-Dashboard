<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源账号供给计算仪表盘 · Account Supply Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1116;--panel:#161a22;--panel-2:#1c2230;--line:#262d3a;--line-soft:#1e2531;
    --txt:#e7ecf3;--txt-2:#9aa6b8;--txt-3:#67718a;
    --accent:#4f8cff;--accent-soft:#13233f;--teal:#2dd4a7;--teal-soft:#0f2b25;
    --amber:#f5b544;--amber-soft:#33260c;--red:#ff6b6b;--red-soft:#331616;
    --r:10px;--r-lg:14px;
    --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans','Noto Sans SC',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(circle at 15% -10%,rgba(79,140,255,.08),transparent 45%),radial-gradient(circle at 95% 0%,rgba(45,212,167,.06),transparent 40%);background-attachment:fixed;}
  .wrap{max-width:1000px;margin:0 auto;padding:40px 24px 80px;}
  .topbar{display:flex;justify-content:flex-end;margin-bottom:14px;}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .lang button{background:transparent;border:none;color:var(--txt-3);font-family:var(--mono);font-size:12px;padding:7px 14px;cursor:pointer;transition:all .15s;}
  .lang button.active{background:var(--accent-soft);color:var(--accent);}
  .lang button:not(.active):hover{color:var(--txt-2);}
  header{margin-bottom:30px;}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
  h1{font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.2;}
  .sub{color:var(--txt-2);font-size:15px;margin-top:8px;max-width:680px;}
  .tabs{display:flex;gap:6px;margin:8px 0 26px;border-bottom:1px solid var(--line);}
  .tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--txt-3);font-family:var(--sans);font-size:14px;font-weight:500;padding:11px 18px;cursor:pointer;margin-bottom:-1px;transition:color .15s,border-color .15s;}
  .tab:hover{color:var(--txt-2);}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .states{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 6px;}
  .st{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;position:relative;}
  .st .stn{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .st .std{font-size:11px;color:var(--txt-3);margin-top:3px;}
  .st .leak{position:absolute;top:10px;right:11px;font-family:var(--mono);font-size:10px;color:var(--red);background:var(--red-soft);border:1px solid rgba(255,107,107,.25);border-radius:4px;padding:1px 5px;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .d-reg{background:var(--txt-3);}.d-warm{background:var(--accent);}.d-ready{background:var(--teal);}.d-act{background:#8fb6ff;}.d-risk{background:var(--red);}.d-rec{background:var(--amber);}.d-dead{background:#444;}
  .leak-cap{font-family:var(--mono);font-size:11px;color:var(--txt-3);margin-bottom:24px;}
  .group{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:20px;overflow:hidden;}
  .ghead{display:flex;align-items:center;gap:11px;padding:16px 22px;border-bottom:1px solid var(--line-soft);background:var(--panel-2);}
  .ghead .num{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accent-soft);border:1px solid #234063;border-radius:6px;padding:3px 8px;}
  .ghead .gt{font-size:16px;font-weight:600;}
  .ghead .gpurpose{margin-left:auto;font-size:12px;color:var(--txt-3);font-family:var(--mono);text-align:right;line-height:1.5;}
  .eq{display:flex;align-items:stretch;flex-wrap:wrap;padding:20px 22px;}
  .eq-in{display:flex;flex-wrap:wrap;gap:12px;flex:1;min-width:240px;align-items:flex-end;}
  .field{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;min-width:120px;flex:1;transition:border-color .15s;}
  .field:focus-within{border-color:var(--accent);}
  .field label{display:block;font-size:11.5px;color:var(--txt-2);margin-bottom:7px;font-weight:500;}
  .field label .tag{font-family:var(--mono);color:var(--txt-3);font-size:11px;}
  .field input{width:100%;background:transparent;border:none;color:var(--txt);font-family:var(--mono);font-size:19px;font-weight:600;outline:none;-moz-appearance:textfield;}
  .field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .eq-op{display:flex;align-items:center;justify-content:center;padding:0 14px;font-family:var(--mono);font-size:24px;color:var(--txt-3);align-self:center;}
  .eq-out{align-self:center;min-width:148px;background:var(--accent-soft);border:1px solid #234063;border-radius:var(--r);padding:14px 18px;text-align:center;}
  .eq-out .ol{font-size:12px;color:#8fb6ff;margin-bottom:4px;}
  .eq-out .ov{font-family:var(--mono);font-size:30px;font-weight:600;color:#8fb6ff;line-height:1.1;}
  .eq-out .of{font-size:11px;color:var(--txt-3);font-family:var(--mono);margin-top:5px;}
  .eq-out.teal{background:var(--teal-soft);border-color:#1c4d40;}
  .eq-out.teal .ol,.eq-out.teal .ov{color:var(--teal);}
  .eq-out.amber{background:var(--amber-soft);border-color:#5c4410;}
  .eq-out.amber .ol,.eq-out.amber .ov{color:var(--amber);}
  .subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:0 22px 20px;}
  .sub{background:var(--bg);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px 14px;}
  .sub .sl{font-size:11.5px;color:var(--txt-2);margin-bottom:5px;}
  .sub .sv{font-family:var(--mono);font-size:22px;font-weight:600;}
  .sub .sf{font-size:10.5px;color:var(--txt-3);font-family:var(--mono);margin-top:3px;}
  .sub.warn .sv{color:var(--amber);} .sub.red .sv{color:var(--red);}
  .note{padding:0 22px 18px;font-size:12.5px;color:var(--txt-3);font-family:var(--mono);line-height:1.7;}
  .note b{color:var(--accent);} .note .hl{color:var(--red);}
  .sec-head{display:flex;align-items:center;gap:10px;margin:34px 0 14px;}
  .sec-head .ico{width:30px;height:30px;border-radius:8px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;color:var(--amber);border:1px solid var(--line);font-weight:600;}
  .sec-head h2{font-size:17px;font-weight:600;}
  .sec-head .hint{margin-left:auto;font-size:12px;color:var(--txt-3);font-family:var(--mono);}
  .dtable{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;}
  .dtable th{text-align:left;font-size:12px;font-weight:600;color:var(--txt-3);text-transform:uppercase;letter-spacing:.06em;padding:13px 16px;background:var(--panel-2);border-bottom:1px solid var(--line);}
  .dtable td{padding:15px 16px;font-size:13.5px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.55;}
  .dtable tr:last-child td{border-bottom:none;}
  .dtable .c-sym{width:34px;text-align:center;font-family:var(--mono);font-weight:600;font-size:15px;}
  .dtable .c-cause{color:var(--txt);font-weight:600;width:22%;}
  .dtable .c-action{color:var(--txt-2);} .dtable .c-action b{color:var(--txt);font-weight:600;}
  .row-red .c-sym{color:var(--red);} .row-red{background:linear-gradient(90deg,rgba(255,107,107,.05),transparent);}
  .row-amber .c-sym{color:var(--amber);} .row-amber{background:linear-gradient(90deg,rgba(245,181,68,.05),transparent);}
  .row-blue .c-sym{color:#8fb6ff;} .row-blue{background:linear-gradient(90deg,rgba(79,140,255,.05),transparent);}
  .row-teal .c-sym{color:var(--teal);} .row-teal{background:linear-gradient(90deg,rgba(45,212,167,.05),transparent);}
  .row-gray .c-sym{color:var(--txt-3);}
  .live-flag{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;margin-left:8px;vertical-align:middle;white-space:nowrap;}
  .flag-on{background:var(--red-soft);color:var(--red);border:1px solid rgba(255,107,107,.3);}
  .flag-ok{background:var(--teal-soft);color:var(--teal);border:1px solid rgba(45,212,167,.3);}
  footer{margin-top:46px;padding-top:22px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--txt-3);font-family:var(--mono);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .rm-lead{font-size:17px;line-height:1.7;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-lg);padding:20px 24px;margin-bottom:24px;}
  .rm-block{margin-bottom:26px;}
  .rm-h{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:600;margin-bottom:12px;}
  .rm-n{font-family:var(--mono);font-size:13px;color:var(--accent);background:var(--accent-soft);border:1px solid #234063;border-radius:7px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rm-block p{font-size:15px;line-height:1.8;color:var(--txt-2);margin:0 0 10px 41px;}
  .rm-block p b{color:var(--txt);font-weight:600;}
  .rm-key{color:var(--accent)!important;font-weight:500;border-left:2px solid var(--accent);padding-left:14px!important;margin-left:41px!important;}
  .rm-list{margin:0 0 0 41px;padding:0;list-style:none;}
  .rm-list li{font-size:15px;line-height:1.75;color:var(--txt-2);padding:9px 0 9px 18px;border-left:1px solid var(--line);}
  .rm-list li b{color:var(--teal);font-weight:600;}
  .rm-soul{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 24px;}
  .rm-soul .rm-h{margin-top:0;}
  .rm-soul p:last-child{margin-bottom:0;}
  .rm-soul p b{color:var(--amber);}
  @media(max-width:600px){h1{font-size:24px;}.wrap{padding:28px 16px 60px;}.eq-op{display:none;}.eq-out{width:100%;margin-top:12px;}.dtable .c-cause{width:auto;}}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="lang">
      <button id="lang-zh" class="active" onclick="setLang('zh')">华语</button>
      <button id="lang-en" onclick="setLang('en')">English</button>
    </div>
  </div>

  <header>
    <div class="kicker">Resource Supply Model · WhatsApp / Telegram</div>
    <h1 data-i="title"></h1>
    <p class="sub" data-i="subtitle"></p>
  </header>

  <div class="tabs">
    <button class="tab active" id="tab-calc" onclick="switchTab('calc')" data-i="tabCalc"></button>
    <button class="tab" id="tab-readme" onclick="switchTab('readme')" data-i="tabReadme"></button>
  </div>

  <!-- README PANEL -->
  <div id="panel-readme" class="panel" style="display:none;">
    <div class="rm-lead" data-i="rmLead"></div>
    <div class="rm-block">
      <div class="rm-h"><span class="rm-n" data-i="n1"></span><span data-i="rmH1"></span></div>
      <p data-i="rmP1a"></p><p data-i="rmP1b"></p>
    </div>
    <div class="rm-block">
      <div class="rm-h"><span class="rm-n" data-i="n2"></span><span data-i="rmH2"></span></div>
      <p data-i="rmP2a"></p><p data-i="rmP2b"></p><p class="rm-key" data-i="rmP2key"></p>
    </div>
    <div class="rm-block">
      <div class="rm-h"><span class="rm-n" data-i="n3"></span><span data-i="rmH3"></span></div>
      <p data-i="rmP3a"></p><p data-i="rmP3b"></p>
    </div>
    <div class="rm-block">
      <div class="rm-h"><span class="rm-n" data-i="n4"></span><span data-i="rmH4"></span></div>
      <ul class="rm-list">
        <li data-i="rmL4a"></li><li data-i="rmL4c"></li>
      </ul>
    </div>
    <div class="rm-block rm-soul">
      <div class="rm-h"><span class="rm-n" data-i="n5"></span><span data-i="rmH5"></span></div>
      <p data-i="rmP5a"></p><p data-i="rmP5b"></p>
    </div>
  </div>

  <!-- CALCULATOR PANEL -->
  <div id="panel-calc" class="panel">

  <div class="states">
    <div class="st"><span class="leak" data-i="leakFr"></span><div class="stn"><span class="dot d-reg"></span><span data-i="stReg"></span></div><div class="std" data-i="stRegD"></div></div>
    <div class="st"><span class="leak" data-i="leakWf"></span><div class="stn"><span class="dot d-warm"></span><span data-i="stWarm"></span></div><div class="std" data-i="stWarmD"></div></div>
    <div class="st"><span class="leak" data-i="leakD"></span><div class="stn"><span class="dot d-act"></span><span data-i="stAct"></span></div><div class="std" data-i="stActD"></div></div>
    <div class="st"><div class="stn"><span class="dot d-rec"></span><span data-i="stRec"></span></div><div class="std" data-i="stRecD"></div></div>
    <div class="st"><div class="stn"><span class="dot d-dead"></span><span data-i="stDead"></span></div><div class="std" data-i="stDeadD"></div></div>
  </div>
  <div class="leak-cap" data-i="leakCap"></div>

  <div class="group">
    <div class="ghead"><span class="num">01</span><span class="gt" data-i="g1t"></span><span class="gpurpose" data-i="g1p"></span></div>
    <div class="eq">
      <div class="eq-in">
        <div class="field"><label data-i="lB"></label><input type="number" id="B" value="10" min="0" step="1"></div>
        <div class="field"><label data-i="lC"></label><input type="number" id="C" value="8" min="0" step="1"></div>
      </div>
      <div class="eq-op">=</div>
      <div class="eq-out"><div class="ol" data-i="oActive"></div><div class="ov" id="o-active">—</div><div class="of">B × C</div></div>
    </div>
    <div class="subgrid">
      <div class="sub"><div class="sl" data-i="sPerUserActive"></div><div class="sv" id="o-peruser-active">—</div><div class="sf" data-i="sPerUserActiveF"></div></div>
      <div class="sub"><div class="sl" data-i="sPerUserTotal"></div><div class="sv" id="o-peruser-total">—</div><div class="sf" data-i="sPerUserTotalF"></div></div>
    </div>
  </div>

  <div class="group">
    <div class="ghead"><span class="num">02</span><span class="gt" data-i="g2t"></span><span class="gpurpose" data-i="g2p"></span></div>
    <div class="eq">
      <div class="eq-in">
        <div class="field"><label data-i="lD"></label><input type="number" id="D" value="5" min="0" max="100" step="0.1"></div>
        <div class="field"><label data-i="lR"></label><input type="number" id="R" value="40" min="0" max="100" step="1"></div>
      </div>
      <div class="eq-op">&rarr;</div>
      <div class="eq-out"><div class="ol" data-i="oNeed"></div><div class="ov" id="o-need">—</div><div class="of" data-i="oNeedF"></div></div>
    </div>
    <div class="note"><span data-i="g2n1"></span> = <b id="n-actloss">—</b></div>
  </div>

  <div class="group">
    <div class="ghead"><span class="num">03</span><span class="gt" data-i="g3t"></span><span class="gpurpose" data-i="g3p"></span></div>
    <div class="eq">
      <div class="eq-in">
        <div class="field"><label data-i="lNeed"></label><input type="number" id="needShow" value="—" disabled style="color:var(--txt-3)"></div>
        <div class="field"><label data-i="lWf"></label><input type="number" id="Wf" value="15" min="0" max="100" step="1"></div>
        <div class="field"><label data-i="lFr"></label><input type="number" id="Fr" value="20" min="0" max="100" step="1"></div>
      </div>
      <div class="eq-op">=</div>
      <div class="eq-out amber"><div class="ol" data-i="oReg"></div><div class="ov" id="o-reg">—</div><div class="of" data-i="oRegF"></div></div>
    </div>
    <div class="subgrid">
      <div class="sub"><div class="sl" data-i="sToWarm"></div><div class="sv" id="o-towarm">—</div><div class="sf" data-i="sToWarmF"></div></div>
      <div class="sub red"><div class="sl" data-i="sYield"></div><div class="sv" id="o-yield">—</div><div class="sf">(1−Fr)×(1−Wf)</div></div>
      <div class="sub red"><div class="sl" data-i="sMult"></div><div class="sv" id="o-mult">—</div><div class="sf" data-i="sMultF"></div></div>
    </div>
    <div class="note"><span class="hl" data-i="g3nk"></span><span data-i="g3na"></span> <b id="n-mult2">—</b> <span data-i="g3nb"></span></div>
  </div>

  <div class="group">
    <div class="ghead"><span class="num">04</span><span class="gt" data-i="g4t"></span><span class="gpurpose" data-i="g4p"></span></div>
    <div class="eq">
      <div class="eq-in">
        <div class="field"><label data-i="lToWarm"></label><input type="number" id="towarmShow" value="—" disabled style="color:var(--txt-3)"></div>
        <div class="field"><label data-i="lW"></label><input type="number" id="W" value="7" min="1" step="1"></div>
      </div>
      <div class="eq-op">=</div>
      <div class="eq-out teal"><div class="ol" data-i="oWarm"></div><div class="ov" id="o-warm">—</div><div class="of" data-i="oWarmF"></div></div>
    </div>
    <div class="note" data-i="g4n"></div>
  </div>

  <div class="group">
    <div class="ghead"><span class="num">05</span><span class="gt" data-i="g5t"></span><span class="gpurpose" data-i="g5p"></span></div>
    <div class="subgrid">
      <div class="sub red"><div class="sl" data-i="sRec"></div><div class="sv" id="o-rec">—</div><div class="sf" data-i="sRecF"></div></div>
      <div class="sub"><div class="sl" data-i="sTr"></div><input type="number" id="Tr" value="2" min="0" step="0.5" style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--txt);font-family:var(--mono);font-size:20px;font-weight:600;padding:5px 8px;margin-top:2px;outline:none;"></div>
    </div>
  </div>

  <div class="group">
    <div class="ghead"><span class="num">06</span><span class="gt" data-i="g6t"></span><span class="gpurpose" data-i="g6p"></span></div>
    <div class="eq">
      <div class="eq-in">
        <div class="field"><label data-i="lOnDev"></label><input type="number" id="ondevShow" value="—" disabled style="color:var(--txt-3)"></div>
        <div class="field"><label data-i="lDev"></label><input type="number" id="dev" value="5" min="1" step="1"></div>
      </div>
      <div class="eq-op">=</div>
      <div class="eq-out"><div class="ol" data-i="oDevices"></div><div class="ov" id="o-devices">—</div><div class="of" id="o-dev-note"></div></div>
    </div>
    <div class="subgrid">
      <div class="sub"><div class="sl" data-i="sPerUserDevA"></div><div class="sv" id="o-peruser-devA">—</div><div class="sf" data-i="sPerUserDevAF"></div></div>
      <div class="sub"><div class="sl" data-i="sPerUserDevT"></div><div class="sv" id="o-peruser-devT">—</div><div class="sf" data-i="sPerUserDevTF"></div></div>
    </div>
  </div>

  <div class="group">
    <div class="ghead"><span class="num">07</span><span class="gt" data-i="g7t"></span><span class="gpurpose" data-i="g7p"></span></div>
    <div class="eq">
      <div class="eq-in">
        <div class="field"><label data-i="lTotal"></label><input type="number" id="totalShow" value="—" disabled style="color:var(--txt-3)"></div>
        <div class="field"><label data-i="lPpl"></label><input type="number" id="ppl" value="50" min="1" step="1"></div>
      </div>
      <div class="eq-op">=</div>
      <div class="eq-out"><div class="ol" data-i="oStaff"></div><div class="ov" id="o-staff">—</div><div class="of" id="o-staff-note"></div></div>
    </div>
    <div class="note"><span data-i="g7n"></span> <span id="t-active">—</span> + <span id="t-warm">—</span> + <span id="t-rec">—</span> = <b id="t-total">—</b></div>
  </div>

  <div class="sec-head">
    <div class="ico">!</div>
    <h2 data-i="diagH"></h2>
    <span class="hint" data-i="diagHint"></span>
  </div>
  <table class="dtable">
    <thead><tr><th></th><th data-i="thSym"></th><th data-i="thCause"></th><th data-i="thAction"></th></tr></thead>
    <tbody>

var LANG='zh';

function applyLang(){
  var t=I18N[LANG];
  document.documentElement.lang = LANG==='zh'?'zh':'en';
  document.querySelectorAll('[data-i]').forEach(function(el){
    var k=el.getAttribute('data-i');
    if(t[k]!==undefined) el.innerHTML=t[k];
  });
  document.getElementById('lang-zh').className = LANG==='zh'?'active':'';
  document.getElementById('lang-en').className = LANG==='en'?'active':'';
  calc();
}
function setLang(l){LANG=l;applyLang();}

function switchTab(which){
  var isCalc = which==='calc';
  document.getElementById('panel-calc').style.display = isCalc?'block':'none';
  document.getElementById('panel-readme').style.display = isCalc?'none':'block';
  document.getElementById('tab-calc').className = 'tab'+(isCalc?' active':'');
  document.getElementById('tab-readme').className = 'tab'+(isCalc?'':' active');
}

var ids=['B','C','D','R','Wf','Fr','Tr','W','dev','ppl'];
function g(id){return parseFloat(document.getElementById(id).value)||0;}
function r1(x){return Math.round(x*10)/10;}
function set(id,v){var e=document.getElementById(id);if(e)e.textContent=v;}
function setVal(id,v){var e=document.getElementById(id);if(e)e.value=v;}
function flag(key,on,onText,okText){
  var e=document.getElementById('flag-'+key);if(!e)return;
  e.textContent=on?('\u26A0 '+onText):('\u2713 '+okText);
  e.className='live-flag '+(on?'flag-on':'flag-ok');
}
function tmpl(s,a,b){return s.replace('#',a).replace('@',b);}

function calc(){
  var t=I18N[LANG];
  var B=g('B'),C=g('C'),D=g('D')/100,R=g('R')/100,
      Wf=g('Wf')/100,Fr=g('Fr')/100,Tr=g('Tr'),
      W=g('W'),dev=g('dev')||1,ppl=g('ppl')||1;
  var active=B*C;
  var actLoss=active*D*(1-R);
  var need=actLoss;
  var yield_=(1-Fr)*(1-Wf); if(yield_<=0)yield_=0.0001;
  var toWarm=need/(1-Wf);
  var reg=need/yield_;
  var mult=1/yield_;
  var warm=toWarm*W;
  var rec=active*D*Tr;
  var total=active+warm+rec;
  var onDevice=active;
  var devices=Math.ceil(onDevice/dev);
  var staff=Math.ceil(total/ppl);
  var B_=B||1;
  var perUserActive=C;
  var perUserTotal=total/B_;
  var perUserDevA=Math.ceil(C/dev);
  var perUserDevT=devices/B_;

  set('o-active',Math.round(active));set('o-need',r1(need));set('o-reg',r1(reg));
  set('o-towarm',r1(toWarm));set('o-yield',(yield_*100).toFixed(0)+'%');set('o-mult',mult.toFixed(2)+'\u00D7');
  set('o-warm',Math.round(warm));
  set('o-rec',r1(rec));set('o-devices',devices);set('o-staff',staff);
  set('o-peruser-active',Math.round(perUserActive));
  set('o-peruser-total',r1(perUserTotal));
  set('o-peruser-devA',perUserDevA);
  set('o-peruser-devT',r1(perUserDevT));
  set('n-actloss',r1(actLoss));set('n-mult2',mult.toFixed(2));
  setVal('needShow',r1(need));setVal('towarmShow',r1(toWarm));
  setVal('ondevShow',Math.round(onDevice));setVal('totalShow',Math.round(total));
  set('o-dev-note','('+Math.round(onDevice)+' \u00F7 '+dev+') '+t.take);
  set('o-staff-note','('+Math.round(total)+' \u00F7 '+ppl+') '+t.take);
  set('t-active',Math.round(active));set('t-warm',Math.round(warm));
  set('t-rec',r1(rec));set('t-total',Math.round(total));

  flag('lossHigh', D*100>=8, tmpl(t.fLossOn,(D*100).toFixed(1)+'%'), t.fLossOk);
  flag('prodLow', toWarm>0 && warm<toWarm*W*0.999, t.fProdOn, t.fProdOk);
  flag('recoverBad', R*100<40||Tr>3, tmpl(t.fRecOn,(R*100).toFixed(0)+'%',Tr), t.fRecOk);
  flag('yieldLow', yield_<0.7, tmpl(t.fYieldOn,(yield_*100).toFixed(0)+'%'), t.fYieldOk);
}

ids.forEach(function(id){var e=document.getElementById(id);if(e)e.addEventListener('input',calc);});
applyLang();
</script>
