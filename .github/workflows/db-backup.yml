name: AMS database backup

on:
  schedule:
    - cron: '0 19 * * *' # 02:00 WIB daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ams-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      file: ${{ steps.dump.outputs.file }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump and encrypt
        id: dump
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          OUT_DIR: backup-out
        run: |
          scripts/backup/backup.sh
          echo "file=$(ls backup-out | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ams-db-backup
          path: backup-out/*.enc
          retention-days: 30
          if-no-files-found: error

  restore-drill:
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: drill
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          name: ams-db-backup
          path: backup-in

      - name: Restore into scratch Postgres and verify
        env:
          RESTORE_DATABASE_URL: postgresql://postgres:drill@localhost:5432/drill
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: scripts/backup/restore-drill.sh "backup-in/${{ needs.backup.outputs.file }}"

  notify-failure:
    needs: [backup, restore-drill]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Slack alert
        env:
          WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No Slack webhook configured"; exit 0; fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":rotating_light: *AMS* — nightly database backup or restore drill FAILED: $RUN_URL\"}" \
            "$WEBHOOK"
