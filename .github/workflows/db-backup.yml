name: AMS database backup

on:
  schedule:
    - cron: '3 1 * * *' # 08:03 GMT +7 daily (off the hour: GitHub delays on-the-hour schedules)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ams-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: drill
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          OUT_DIR: backup-out
        run: scripts/backup/backup.sh

      - name: Restore drill into scratch Postgres
        env:
          RESTORE_DATABASE_URL: postgresql://postgres:drill@localhost:5432/drill
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: scripts/backup/restore-drill.sh backup-out/*.enc

      # Keyless: the org policy blocks service-account keys, so GitHub's OIDC token is
      # exchanged for a short-lived token of ams-backup-uploader (Workload Identity Federation).
      - name: Authenticate to Google
        id: gauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GDRIVE_WIF_PROVIDER }}
          service_account: ${{ vars.GDRIVE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive

      # The Shared Drive is the only place backups are kept; nothing is stored on GitHub.
      - name: Upload to Google Shared Drive
        env:
          GDRIVE_ACCESS_TOKEN: ${{ steps.gauth.outputs.access_token }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
        run: node scripts/backup/upload-drive.mjs backup-out/*.enc

  notify-failure:
    needs: backup
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Slack alert
        env:
          WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No Slack webhook configured"; exit 0; fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":rotating_light: *AMS* — daily database backup or restore drill FAILED: $RUN_URL\"}" \
            "$WEBHOOK"
